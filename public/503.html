<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 Service Currently Unavailable</title>
<link rel="stylesheet" href="/css/httpcodepages.css">
</head>
<body>
<div class="neon-circle"></div>
<div class="error-container animate-in">
  <h1 class="error-code">503</h1>
  <h2 class="error-title neon-text-h1">Service Currently Unavailable</h2>
  <p class="error-message">We are making major changes to the site, or the site is currently down.</p>
  <p class="error-message">You can <a href="/index.html">try again</a>, but we suggest checking your email for the latest updates about the current situation.</p>
  <a class="nav-btn neon-primary-button" href="https://mail.google.com" rel="nofollow noreferrer noopener" target="_blank" class="nav-btn neon-primary-button">Email</a>
</div>
</body>
</html>
